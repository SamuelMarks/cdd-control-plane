[package]
name = "cdd-control-plane"
version = "0.0.5"
edition = "2021"

[dependencies]
actix-web = { version = "4.17", default-features = false, features = ["macros"] }
actix-web-httpauth = { version = "0.8", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "getrandom", "password-hash"] }
async-trait = { version = "0.1", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["std", "now", "serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
crypto_box = { version = "0.9", default-features = false, features = ["getrandom", "salsa20", "seal", "std"] }
crypto_secretbox = { version = "0.1", default-features = false, features = ["getrandom", "salsa20", "std"] }
derive_more = { version = "2.1", default-features = false, features = ["std", "display", "from"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono", "serde_json"] }
env_logger = { version = "0.11", default-features = false }
fred = { version = "10.1", default-features = false, features = ["i-lists"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
log = { version = "0.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
utoipa = { version = "6.0", default-features = false, features = ["macros", "actix_extras", "chrono"] }

[dev-dependencies]
mockall = { version = "0.15", default-features = false }
uuid = { version = "1.28", default-features = false, features = ["std", "v4"] }

[lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(tarpaulin_include)", "cfg(coverage)"] }

[lints.rustdoc]
all = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_for_each = "allow"
double_must_use = "allow"

[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.dev]
debug = 1
